name: MEU SÓCIO - testes funcionais e regressão visual

on:
  push:
    branches:
      - feature/reizzor-station
      - feature/visual-v0032
      - feature/visual-v0033-faithful
      - feature/icone01-paleta-azul
      - feature/icone01-publicacao
      - fix/paleta-unificada-v0036
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar a suíte de testes
        run: npm test
      - name: Verificar sintaxe da interface e do PWA
        run: |
          node --check js/app.js
          node --check js/reizzor-station.js
          node --check js/store.js
          node --check js/logic.js
          node --check js/push.js
          node --check js/updater.js
          node --check service-worker.js
      - name: Validar arquivos de tema
        run: |
          test -f css/theme-v0032.css
          test -f css/experience-v0033.css
          test -f css/palette-v0036.css
          test -f assets/socio-waves.svg
          grep -q 'theme-v0032.css' index.html
          grep -q 'theme-v0032.css' service-worker.js
          grep -q 'experience-v0033.css' service-worker.js
          grep -q 'palette-v0036.css' service-worker.js
          grep -q 'socio-waves.svg' service-worker.js
