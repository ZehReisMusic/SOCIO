name: Publicar ícone 01 aprovado (PWA)

on:
  push:
    branches:
      - feature/icone01-publicacao
    paths:
      - 'assets/icon-v1-source/**'
      - 'scripts/build-approved-icon.py'
      - '.github/workflows/publish-approved-icon.yml'

permissions:
  contents: write

jobs:
  prepare-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch do ícone
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Gerar PNGs a partir da versão 01 aprovada
        run: python scripts/build-approved-icon.py
      - name: Salvar PNGs oficiais na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Ícones oficiais já atualizados."
          else
            git commit -m "asset: atualizar PNGs MEU SÓCIO com ícone 01 aprovado"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
